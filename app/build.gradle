plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
}

def localSecrets = new Properties()
def localSecretsFile = rootProject.file('secrets.properties')
if (localSecretsFile.isFile()) {
    localSecretsFile.withReader('UTF-8') { localSecrets.load(it) }
}
def apiUser = providers.gradleProperty('DP_API_USER')
        .orElse(providers.environmentVariable('DP_API_USER'))
        .getOrElse(localSecrets.getProperty('DP_API_USER', ''))
def apiPassword = providers.gradleProperty('DP_API_PASSWORD')
        .orElse(providers.environmentVariable('DP_API_PASSWORD'))
        .getOrElse(localSecrets.getProperty('DP_API_PASSWORD', ''))

android {
    namespace 'br.com.dotchagas.deunoposteorig.deunoposteorig'
    compileSdk = 36

    defaultConfig {
        applicationId "br.com.dotchagas.deunoposteorig.deunoposteorig"
        minSdk = 24
        targetSdk = 36
        versionCode = 17
        versionName = "1.17"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField 'String', 'DP_API_USER', groovy.json.JsonOutput.toJson(apiUser)
        buildConfigField 'String', 'DP_API_PASSWORD', groovy.json.JsonOutput.toJson(apiPassword)
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.google.android.material:material:1.14.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    implementation 'com.google.android.gms:play-services-ads:25.3.0'
    implementation 'com.google.firebase:firebase-messaging:25.0.2'
    implementation 'com.google.firebase:firebase-analytics:23.2.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.3.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"
}
